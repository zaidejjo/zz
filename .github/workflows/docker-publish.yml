name: docker-publish

# Publishes the pre-built `zz` toolchain, AOT builder, and AOT runtime
# images to GHCR **and** Docker Hub. Image names follow the repo owner
# automatically (`github.repository_owner`), so moving zaidejjo/zz ->
# zz-language/zz needs zero workflow changes — the tags below resolve the
# owner at runtime. The Docker Hub namespace comes from the
# `DOCKERHUB_USERNAME` repo secret instead (it may differ from the GitHub
# owner).
#
# Tags published from one release stay pinned together:
#   <owner>/zz:<version>            CLI/toolchain only
#   <owner>/zz:<version>-builder    Clang + dev headers + zz
#   <owner>/zz:<version>-runtime    runtime shared libraries only
#   <owner>/zz:latest-builder       moving preview aliases
#   <owner>/zz:latest-runtime
#
# Triggers: a published GitHub Release, or manual dispatch. The images
# install the Release's prebuilt zips — nothing here compiles (the
# compiler was built exactly once by the release workflow). The Release it
# consumes was cut from a green main, so this workflow only runs the
# builder -> runtime smoke job described below.
#
# Supply chain:
#   * every image is pushed with SLSA provenance (`mode=max`) and an SBOM
#     attestation, stored by the registry next to the image index;
#   * every pushed digest is signed keylessly with Sigstore/Fulcio using the
#     workflow's GitHub OIDC identity (`id-token: write`, no long-lived key);
#   * `smoke` then compiles docker/smoke/hello.zz in the just-published
#     builder and runs it on the matching runtime, so a glibc or shared
#     library drift fails the publish instead of shipping.
#
# Verify a published image:
#   cosign verify ghcr.io/<owner>/zz:<version>-runtime \
#     --certificate-identity-regexp \
#       'https://github.com/<owner>/zz/.github/workflows/docker-publish.yml@.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#   docker buildx imagetools inspect ghcr.io/<owner>/zz:<version>-runtime \
#     --format '{{json .Provenance}}'
#
# Runs in parallel with aur-publish off the same `release: published`
# event; both consume the same attached zips.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package without leading v (default: Cargo.toml; needed to rebuild an older tag's image)"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  # Owner-agnostic: resolves to `zaidejjo` now, `zz-language` after the move.
  IMAGE_NAME: ${{ github.repository_owner }}/zz

jobs:
  build-push:
    name: build + push toolchain, builder, runtime images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing: Fulcio exchanges this OIDC token for a
      # short-lived signing certificate. No key material is stored.
      id-token: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
      ghcr_repo: ${{ steps.ver.outputs.ghcr_repo }}
      dhub_repo: ${{ steps.ver.outputs.dhub_repo }}
      builder_digest: ${{ steps.builder.outputs.digest }}
      runtime_digest: ${{ steps.runtime.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: resolve version + tags
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ -n "${{ inputs.version }}" ]; then
            TAG="v${{ inputs.version }}"
          else
            # Manual dispatch: version comes from the tree (normally main).
            TAG="v$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          fi
          case "$TAG" in
            v*) VER="${TAG#v}" ;;
            *) echo "error: tag must look like vX.Y.Z, got '$TAG'" >&2; exit 1 ;;
          esac
          MAJ="${VER%%.*}"
          REST="${VER#*.}"
          MIN="${REST%%.*}"
          SHA="$(git rev-parse --short HEAD)"
          GHCR="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          DHUB=""
          TAGS="$GHCR:latest,$GHCR:$VER,$GHCR:$MAJ.$MIN,$GHCR:$MAJ,$GHCR:v$VER,$GHCR:sha-$SHA"
          BUILDER_TAGS="$GHCR:latest-builder,$GHCR:$VER-builder,$GHCR:sha-$SHA-builder"
          RUNTIME_TAGS="$GHCR:latest-runtime,$GHCR:$VER-runtime,$GHCR:sha-$SHA-runtime"
          echo "image tags: latest, $VER, $MAJ.$MIN, $MAJ, v$VER, sha-$SHA"
          echo "builder tags: latest-builder, $VER-builder, sha-$SHA-builder"
          echo "runtime tags: latest-runtime, $VER-runtime, sha-$SHA-runtime"
          # Docker Hub mirror (same tags, docker.io namespace). Guarded on
          # the secret so forks without it still publish GHCR-only instead
          # of failing at login/push.
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            DHUB="docker.io/${{ secrets.DOCKERHUB_USERNAME }}/zz"
            TAGS="$TAGS,$DHUB:latest,$DHUB:$VER,$DHUB:$MAJ.$MIN,$DHUB:$MAJ,$DHUB:v$VER,$DHUB:sha-$SHA"
            BUILDER_TAGS="$BUILDER_TAGS,$DHUB:latest-builder,$DHUB:$VER-builder,$DHUB:sha-$SHA-builder"
            RUNTIME_TAGS="$RUNTIME_TAGS,$DHUB:latest-runtime,$DHUB:$VER-runtime,$DHUB:sha-$SHA-runtime"
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
            echo "docker hub tags: latest, $VER, $MAJ.$MIN, $MAJ, v$VER, sha-$SHA"
          else
            echo "dockerhub=false" >> "$GITHUB_OUTPUT"
            echo "DOCKERHUB_USERNAME not set, skipping Docker Hub mirror"
          fi
          {
            echo "version=$VER"
            echo "ghcr_repo=$GHCR"
            echo "dhub_repo=$DHUB"
            echo "tags=$TAGS"
            echo "builder_tags=$BUILDER_TAGS"
            echo "runtime_tags=$RUNTIME_TAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Builder/runtime images run apt under the target architecture; the
      # toolchain image itself still needs no emulation.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN gets packages:write from the job permissions above.
          # No long-lived secret needed. For a PRIVATE package, consumers
          # (e.g. Render) need a classic PAT with read:packages instead.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.ver.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push toolchain image
        id: toolchain
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.toolchain
          # Prebuilt zips ship per arch, so both platforms are plain file
          # copies — no QEMU emulation needed (the old source build needed
          # it for arm64 at ~5-10x slowdown).
          platforms: linux/amd64,linux/arm64
          push: true
          # SLSA provenance (max: inputs, base images, build args) + SPDX
          # SBOM, both attached to the image index. GHCR and Docker Hub both
          # store attestation manifests.
          provenance: mode=max
          sbom: true
          tags: ${{ steps.ver.outputs.tags }}
          labels: |
            org.opencontainers.image.title=zz
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
          build-args: |
            ZZ_VERSION=${{ steps.ver.outputs.version }}
            GITHUB_REPOSITORY=${{ github.repository }}

      # Builder/runtime tags are tied to the exact toolchain version just
      # pushed, so Clang and the runtime shared libraries cannot drift.
      - name: Build and push AOT builder image
        id: builder
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.builder
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.ver.outputs.builder_tags }}
          labels: |
            org.opencontainers.image.title=zz-builder
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
          build-args: |
            TOOLCHAIN_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}

      - name: Build and push AOT runtime image
        id: runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.runtime
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.ver.outputs.runtime_tags }}
          labels: |
            org.opencontainers.image.title=zz-runtime
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}

      # Sign the pushed *index* digests, not the tags: tags move (latest,
      # major/minor shorthands), digests do not. Signing both registries when
      # the mirror is configured keeps GHCR and Docker Hub verifiable with one
      # identity. cosign reuses the docker logins above for registry auth.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          # Pinned: the action's default moves with its major tag.
          cosign-release: 'v2.5.2'

      - name: Sign published image digests
        env:
          GHCR_REPO: ${{ steps.ver.outputs.ghcr_repo }}
          DHUB_REPO: ${{ steps.ver.outputs.dhub_repo }}
          TOOLCHAIN_DIGEST: ${{ steps.toolchain.outputs.digest }}
          BUILDER_DIGEST: ${{ steps.builder.outputs.digest }}
          RUNTIME_DIGEST: ${{ steps.runtime.outputs.digest }}
        run: |
          set -euo pipefail
          repos="$GHCR_REPO"
          if [ -n "$DHUB_REPO" ]; then
            repos="$repos $DHUB_REPO"
          fi
          for repo in $repos; do
            for digest in "$TOOLCHAIN_DIGEST" "$BUILDER_DIGEST" "$RUNTIME_DIGEST"; do
              if [ -z "$digest" ]; then
                echo "error: build-push produced no digest for $repo" >&2
                exit 1
              fi
              echo "signing $repo@$digest"
              cosign sign --yes "$repo@$digest"
            done
          done

  smoke:
    name: builder -> runtime smoke test
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compiles a real fixture in the published builder, checks the produced
      # binary is dynamically linked against the runtime libraries, then runs
      # it on the published runtime. A missing libsqlite3, a glibc skew, or an
      # unusable `zz` binary fails the publish.
      - name: Build in -builder and run on -runtime
        env:
          VERSION: ${{ needs.build-push.outputs.version }}
        run: |
          set -euo pipefail
          repo="${REGISTRY}/${IMAGE_NAME}"
          builder="${repo}:${VERSION}-builder"
          runtime="${repo}:${VERSION}-runtime"
          docker pull "$builder"
          docker pull "$runtime"

          mkdir -p smoke-out
          docker run --rm \
            -v "$PWD/docker/smoke:/src:ro" \
            -v "$PWD/smoke-out:/out" \
            "$builder" zz build -p /src/hello.zz -o /out/hello

          docker run --rm -v "$PWD/smoke-out:/out" \
            --entrypoint ldd "$builder" /out/hello | tee smoke-ldd.txt
          grep -q 'libsqlite3' smoke-ldd.txt

          out=$(docker run --rm -v "$PWD/smoke-out:/out" "$runtime" /out/hello)
          echo "$out"
          grep -qx 'smoke-ok' <<<"$out"
          grep -q 'smoke-sha256: ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad' <<<"$out"
