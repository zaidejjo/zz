name: CI

# Single place where the suite runs. Everything downstream (release,
# docker, AUR publishers) triggers off CI success or Release events and
# never re-runs tests.
#
# Triggers:
#   push to dev or main (merge commits included — the merge itself is
#     tested, so main is always green),
#   PRs targeting dev or main (feature branches get checked before merge).

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

env:
  CARGO_TERM_COLOR: always
  # Pinned Clang major for every native build below (`zz` probes
  # `clang-<ver>` first via ZZ_CLANG_VERSION; the sanitizer leg asserts
  # the match and logs the exact version).
  ZZ_CLANG_VERSION: "18"

jobs:
  test:
    name: test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: install native deps
        # Native codegen links -lcurl -lsqlite3 and compiles with clang.
        # Runner images don't guarantee the headers — install explicitly
        # so the --native test legs don't fail with `curl/curl.h not found`.
        # Clang is version-pinned (matches ZZ_CLANG_VERSION above) so
        # sanitizer/bench builds never drift with the runner image.
        run: sudo apt-get update && sudo apt-get install -y clang-18 libcurl4-openssl-dev libsqlite3-dev
      - name: log pinned toolchain
        run: clang-18 --version
      - name: fmt check
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: 'test (PR: fast suite — VM legs only)'
        if: runner.os != 'Windows' && github.event_name == 'pull_request'
        # PR signal in minutes: unit + e2e (VM) + VM-only parity.
        run: ./scripts/test-fast.sh
      - name: 'test (PR: batched native parity)'
        if: runner.os != 'Windows' && github.event_name == 'pull_request'
        # All batchable strict fixtures' native legs in ~4 clang builds
        # (same programs, same flags, demuxed per file). Individuals run
        # VM-only inside test-fast.sh above.
        run: ZZ_BATCH_NATIVE=1 cargo test -p zz_cli --test batched_parity
      - name: 'test (PR: ASan+UBSan AOT leg)'
        if: runner.os != 'Windows' && github.event_name == 'pull_request'
        # Instrumented HIR→C and Chunk→C builds of the diff corpus + small
        # programs (reports are fatal). Asserts the ZZ_CLANG_VERSION pin
        # and logs the exact toolchain. Not in test-fast.sh: clang builds
        # are minutes, not seconds.
        run: cargo test -p zz_cli --test sanitizer_aot -- --nocapture
      - name: 'test (merge: full suite, strict natives via batch)'
        if: runner.os != 'Windows' && github.event_name != 'pull_request'
        # `ZZ_BATCH_NATIVE=1`: strict-success natives run batched
        # (same programs, same flags); quad, error, and known-failure
        # natives stay individual. Full coverage, no duplicated builds.
        run: ZZ_BATCH_NATIVE=1 cargo test --all
      - name: 'test (windows: VM-only, native backend unsupported)'
        if: runner.os == 'Windows'
        # The native backend is POSIX/Linux-only (epoll/fork AOT server, no
        # Windows FFI link — see ffi.rs). ZZ_SKIP_NATIVE keeps the VM legs
        # running while the native legs report skips.
        run: cargo test --all
        env:
          ZZ_SKIP_NATIVE: 1

  check-arm:
    name: check (aarch64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: install native deps
        run: sudo apt-get update && sudo apt-get install -y clang libcurl4-openssl-dev libsqlite3-dev
      - name: check workspace for aarch64
        # Native ARM runner (real gcc, no cross toolchain needed).
        # Type-checks every crate for the arch AUR ships — catches
        # arch-dependent breakage (e.g. c_char signedness) x86_64 can
        # never see. No linking, no tests: pure type gate, stays fast.
        run: cargo check --workspace --all-targets