name: CI

# Single place where the suite runs. Everything downstream (release,
# docker, AUR publishers) triggers off CI success or Release events and
# never re-runs tests.
#
# Triggers:
#   push to dev or main (merge commits included — the merge itself is
#     tested, so main is always green),
#   PRs targeting dev or main (feature branches get checked before merge).

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: install native deps
        # Native codegen links -lcurl -lsqlite3 and compiles with clang.
        # Runner images don't guarantee the headers — install explicitly
        # so the --native test legs don't fail with `curl/curl.h not found`.
        run: sudo apt-get update && sudo apt-get install -y clang libcurl4-openssl-dev libsqlite3-dev
      - name: fmt check
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: 'test (unix: full suite incl. native legs)'
        if: runner.os != 'Windows'
        run: cargo test --all
      - name: 'test (windows: VM-only, native backend unsupported)'
        if: runner.os == 'Windows'
        # The native backend is POSIX/Linux-only (epoll/fork AOT server, no
        # Windows FFI link — see ffi.rs). ZZ_SKIP_NATIVE keeps the VM legs
        # running while the native legs report skips.
        run: cargo test --all
        env:
          ZZ_SKIP_NATIVE: 1

  check-arm:
    name: check (aarch64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: install native deps
        run: sudo apt-get update && sudo apt-get install -y clang libcurl4-openssl-dev libsqlite3-dev
      - name: check workspace for aarch64
        # Native ARM runner (real gcc, no cross toolchain needed).
        # Type-checks every crate for the arch AUR ships — catches
        # arch-dependent breakage (e.g. c_char signedness) x86_64 can
        # never see. No linking, no tests: pure type gate, stays fast.
        run: cargo check --workspace --all-targets