name: CI

# Single place where the suite runs. Everything downstream (release,
# docker, AUR publishers) triggers off CI success or Release events and
# never re-runs tests.
#
# This file is the orchestrator only: the per-platform work lives in
# `ci-test.yml` (reusable, called once per runner). GitHub Actions loads
# only `.github/workflows/*.yml` at the top level — subdirectories are
# ignored — so "folders" are expressed as separate reusable workflows,
# not nested directories.
#
# Triggers:
#   push to dev or main (merge commits included — the merge itself is
#     tested, so main is always green),
#   PRs targeting dev or main (feature branches get checked before merge),
#   manual dispatch.

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint (fmt + clippy)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
      - name: fmt check
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: test (${{ matrix.name }})
    strategy:
      # One platform failing must not hide the others: we want all logs.
      fail-fast: false
    matrix:
      include:
        # runner labels verified 2026: macos-13 (Intel) is retired;
        # Intel is `macos-15-intel`. Windows ARM64 is `windows-11-arm`.
        - name: linux-x86_64
          runner: ubuntu-24.04
          family: linux
          native: true
          timeout: 30
          clang_pin: "23"
          docker_smoke: true
        - name: linux-aarch64
          runner: ubuntu-24.04-arm
          family: linux
          native: true
          timeout: 45
          clang_pin: ""
          docker_smoke: false
        - name: macos-aarch64
          runner: macos-14
          family: macos
          native: true
          timeout: 45
          clang_pin: ""
          docker_smoke: false
        - name: macos-x86_64
          runner: macos-15-intel
          family: macos
          native: true
          timeout: 45
          clang_pin: ""
          docker_smoke: false
        - name: windows-x86_64
          runner: windows-2025
          family: windows
          native: true
          timeout: 60
          clang_pin: ""
          docker_smoke: false
        - name: windows-aarch64
          runner: windows-11-arm
          family: windows
          native: true
          timeout: 60
          clang_pin: ""
          docker_smoke: false
    uses: ./.github/workflows/ci-test.yml
    with:
      name: ${{ matrix.name }}
      runner: ${{ matrix.runner }}
      family: ${{ matrix.family }}
      native: ${{ matrix.native }}
      timeout: ${{ matrix.timeout }}
      clang_pin: ${{ matrix.clang_pin }}
      docker_smoke: ${{ matrix.docker_smoke }}
