name: CI

# Single place where the suite runs. Everything downstream (release,
# docker, AUR publishers) triggers off CI success or Release events and
# never re-runs tests.
#
# This file is the orchestrator only: the per-platform work lives in
# `ci-test.yml` (reusable). GitHub Actions loads only
# `.github/workflows/*.yml` at the top level — subdirectories are ignored —
# so "folders" are expressed as separate reusable workflows, not nested
# directories.
#
# Jobs are grouped by OS family (linux/macos/windows). Each caller job
# passes the legs for that family as JSON, and the reusable workflow builds
# its matrix from them — so the UI shows one group per OS with the two
# architectures nested underneath, instead of six unrelated top-level jobs.
#
# Triggers:
#   push to dev or main (merge commits included — the merge itself is
#     tested, so main is always green),
#   PRs targeting dev or main (feature branches get checked before merge),
#   manual dispatch.

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint (fmt + clippy)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
      - name: fmt check
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: actionlint (workflow syntax)
        # Not preinstalled on the Ubuntu images (exit 127 otherwise). Pinned
        # release tarball: no third-party action, no dangling "latest".
        # Catches the class of error that fails a workflow at parse time
        # (no jobs, no logs) before it lands.
        run: |
          set -euo pipefail
          version=1.7.7
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -version
          /tmp/actionlint

  # --- linux: x86_64 (full incl. sanitizer/docker) + aarch64 -------------
  linux:
    name: linux
    uses: ./.github/workflows/ci-test.yml
    with:
      family: linux
      legs: >-
        [
          {"name": "linux-x86_64", "runner": "ubuntu-24.04", "native": true,
           "timeout": 30, "clang_pin": "23", "docker_smoke": true},
          {"name": "linux-aarch64", "runner": "ubuntu-24.04-arm", "native": true,
           "timeout": 45, "clang_pin": "", "docker_smoke": false}
        ]

  # --- macos: apple silicon + intel --------------------------------------
  # Runner labels verified 2026: macos-13 (Intel) is retired, so Intel is
  # `macos-15-intel`; Apple silicon is `macos-14`.
  macos:
    name: macos
    uses: ./.github/workflows/ci-test.yml
    with:
      family: macos
      legs: >-
        [
          {"name": "macos-aarch64", "runner": "macos-14", "native": true,
           "timeout": 45, "clang_pin": "", "docker_smoke": false},
          {"name": "macos-x86_64", "runner": "macos-15-intel", "native": true,
           "timeout": 45, "clang_pin": "", "docker_smoke": false}
        ]

  # --- windows: x86_64 + arm64 -------------------------------------------
  windows:
    name: windows
    uses: ./.github/workflows/ci-test.yml
    with:
      family: windows
      legs: >-
        [
          {"name": "windows-x86_64", "runner": "windows-2025", "native": true,
           "timeout": 60, "clang_pin": "", "docker_smoke": false},
          {"name": "windows-aarch64", "runner": "windows-11-arm", "native": true,
           "timeout": 60, "clang_pin": "", "docker_smoke": false}
        ]
