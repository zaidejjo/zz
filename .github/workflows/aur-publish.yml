name: aur-publish

# Publishes the ZZ toolchain to the `zz-lang` AUR package when a GitHub
# Release is published. It installs `/usr/bin/zz` (so `zz run main.zz`
# works) plus `/usr/bin/zz-lsp`.
#
# NOTE: the sibling `zz` package is intentionally NOT pushed yet — its AUR
# orphan request was accepted but the package still needs to be adopted on
# aur.archlinux.org (one click while orphaned) before CI can push to it.
# After adopting, re-add `zz` to the push step below.
#
# Required repo secret: `AUR_SSH_PRIVATE_KEY` (AUR account SSH private key;
# public key registered at https://aur.archlinux.org/account).
#
# Flow: resolve tag -> verify Cargo.toml version -> tarball sha256 ->
# render PKGBUILD from packaging/aur/PKGBUILD.template ->
# makepkg --printsrcinfo (.SRCINFO) -> push zz-lang.git.
# Re-running the same Release is a no-op (skips push when AUR is current).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.0)"
        required: true
        type: string
      pkgrel:
        description: "Arch pkgrel (bump to republish same version)"
        required: false
        default: "1"
        type: string

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: aur-publish
  cancel-in-progress: false

jobs:
  publish:
    name: publish zz-lang to AUR
    runs-on: ubuntu-latest
    # makepkg --printsrcinfo is canonical for .SRCINFO; it only exists on Arch.
    container:
      image: archlinux:base-devel
    permissions:
      contents: read
    steps:
      - name: install git/ssh tooling
        run: |
          pacman -Syu --noconfirm git openssh curl sudo namcap >/dev/null 2>&1
          useradd -m builder 2>/dev/null || true
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          git config --global --add safe.directory '*'
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: resolve version + tarball sha256
        id: ver
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          echo "tag=$TAG"
          case "$TAG" in
            v*) PKGVER="${TAG#v}" ;;
            *) echo "error: tag must look like vX.Y.Z, got '$TAG'" >&2; exit 1 ;;
          esac
          case "$PKGVER" in
            *"-"*) echo "error: pkgver must not contain '-': $PKGVER" >&2; exit 1 ;;
          esac
          CARGO_VER="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          echo "cargo version: $CARGO_VER / tag version: $PKGVER"
          if [ "$CARGO_VER" != "$PKGVER" ]; then
            echo "error: Cargo.toml version ($CARGO_VER) != tag version ($PKGVER)." >&2
            echo "Bump [workspace.package] version first, then re-cut the Release." >&2
            exit 1
          fi
          PKGREL="${{ inputs.pkgrel || '1' }}"
          TARBALL_URL="https://github.com/zaidejjo/zz/archive/refs/tags/$TAG.tar.gz"
          echo "downloading $TARBALL_URL"
          curl -fsSL "$TARBALL_URL" -o /tmp/upstream.tar.gz
          SHA256="$(sha256sum /tmp/upstream.tar.gz | cut -d' ' -f1)"
          echo "sha256=$SHA256"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "pkgver=$PKGVER" >> "$GITHUB_OUTPUT"
          echo "pkgrel=$PKGREL" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: render PKGBUILD
        run: |
          ./packaging/aur/render.sh "${{ steps.ver.outputs.pkgver }}" "${{ steps.ver.outputs.sha256 }}" /tmp/aur-out
          PKGREL="${{ steps.ver.outputs.pkgrel }}"
          if [ "$PKGREL" != "1" ]; then
            sed -i "s/^pkgrel=1$/pkgrel=$PKGREL/" /tmp/aur-out/zz-lang/PKGBUILD
          fi
          echo "--- zz-lang/PKGBUILD ---"
          cat /tmp/aur-out/zz-lang/PKGBUILD

      - name: generate .SRCINFO + namcap lint
        run: |
          pkg=zz-lang
          rm -rf "/tmp/build-$pkg"
          mkdir -p "/tmp/build-$pkg"
          cp "/tmp/aur-out/$pkg/PKGBUILD" "/tmp/build-$pkg/PKGBUILD"
          chown -R builder:builder "/tmp/build-$pkg"
          su builder -c "cd /tmp/build-$pkg && makepkg --printsrcinfo > .SRCINFO"
          cp "/tmp/build-$pkg/.SRCINFO" "/tmp/aur-out/$pkg/.SRCINFO"
          echo "--- $pkg/.SRCINFO ---"
          cat "/tmp/aur-out/$pkg/.SRCINFO"
          echo "--- namcap $pkg/PKGBUILD ---"
          su builder -c "cd /tmp/build-$pkg && namcap PKGBUILD" || true

      - name: setup AUR ssh
        run: |
          if [ -z "${AUR_SSH_PRIVATE_KEY:-}" ]; then
            echo "error: secret AUR_SSH_PRIVATE_KEY is not set." >&2
            echo "Add the AUR account SSH private key as a repo secret first." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          # keyscan must yield a real host key: an empty known_hosts fails
          # later at clone time with a confusing "Host key verification
          # failed", so retry then fail fast with a clear message.
          rm -f ~/.ssh/known_hosts
          for _try in 1 2 3; do
            if ssh-keyscan -t ed25519,rsa aur.archlinux.org > ~/.ssh/known_hosts 2>/dev/null \
              && grep -q "aur.archlinux.org" ~/.ssh/known_hosts; then
              break
            fi
            echo "keyscan attempt $_try failed, retrying..." >&2
            sleep 5
          done
          if ! grep -q "aur.archlinux.org" ~/.ssh/known_hosts 2>/dev/null; then
            echo "error: ssh-keyscan aur.archlinux.org returned no host keys after 3 tries." >&2
            exit 1
          fi
          chmod 600 ~/.ssh/known_hosts
          printf 'Host aur.archlinux.org\n  User aur\n  IdentityFile ~/.ssh/aur\n  IdentitiesOnly yes\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

      - name: push zz-lang to AUR
        run: |
          PKGVER="${{ steps.ver.outputs.pkgver }}"
          PKGREL="${{ steps.ver.outputs.pkgrel }}"
          pkg=zz-lang
          echo "=== $pkg ==="
          rm -rf "/tmp/aur-$pkg"
          git clone "ssh://aur@aur.archlinux.org/$pkg.git" "/tmp/aur-$pkg"
          cp "/tmp/aur-out/$pkg/PKGBUILD" "/tmp/aur-$pkg/PKGBUILD"
          cp "/tmp/aur-out/$pkg/.SRCINFO" "/tmp/aur-$pkg/.SRCINFO"
          cd "/tmp/aur-$pkg"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "$pkg already at $PKGVER-$PKGREL, skipping push"
            exit 0
          fi
          git commit -m "upgpkg: $pkg $PKGVER-$PKGREL"
          git push origin HEAD:master
          echo "pushed $pkg $PKGVER-$PKGREL"
