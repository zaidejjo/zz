name: aur-publish

# Publishes the ZZ toolchain to the `zz-lang` AUR package when a GitHub
# Release is published. `yay -S zz-lang` installs a PREBUILT binary
# (no compilation).
#
# Two jobs, strict order:
#   publish      — Arch container: download the release zips (built once
#                  by the release workflow — nothing here compiles),
#                  point the PKGBUILD at them, generate .SRCINFO with
#                  makepkg, upload both as a workflow artifact.
#   push-aur     — plain ubuntu-latest: clone the AUR repo over SSH and push.
#                  (SSH lives here, not in the Arch container — stock Ubuntu
#                  OpenSSH is the ecosystem standard for AUR publishing.)
#
# SSH trust: host keys are PINNED in packaging/aur/aur_known_hosts (public
# keys — safe to commit). No runtime keyscan, nothing to flake. If AUR ever
# rotates keys the smoke test fails loudly with both fingerprints logged.
#
# Installs `/usr/bin/zz` (so `zz run main.zz` works) plus `/usr/bin/zz-lsp`.
#
# NOTE: the sibling `zz` package is intentionally NOT pushed yet — its AUR
# orphan request was accepted but the package still needs to be adopted on
# aur.archlinux.org (one click while orphaned) before CI can push to it.
# After adopting, re-add `zz` to the push step below.
#
# Required repo secret: `AUR_SSH_PRIVATE_KEY` (AUR account SSH private key;
# public key registered at https://aur.archlinux.org/account).
#
# Flow: release zips (built once by `release.yml`) -> resolve shas ->
# render PKGBUILD -> makepkg --printsrcinfo (.SRCINFO) -> push zz-lang.git.
# Re-running the same Release re-renders + skips the AUR push when it is
# already current. This workflow runs no tests and builds nothing: the
# Release it consumes was cut from a green main.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.0)"
        required: true
        type: string
      pkgrel:
        description: "Arch pkgrel (bump to republish same version)"
        required: false
        default: "1"
        type: string

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: aur-publish
  cancel-in-progress: false

jobs:
  publish:
    name: publish zz-lang to AUR
    runs-on: ubuntu-latest
    # makepkg --printsrcinfo is canonical for .SRCINFO; it only exists on Arch.
    container:
      image: archlinux:base-devel
    permissions:
      contents: read
    outputs:
      pkgver: ${{ steps.ver.outputs.pkgver }}
      pkgrel: ${{ steps.ver.outputs.pkgrel }}
    steps:
      - name: install git/ssh tooling
        run: |
          pacman -Syu --noconfirm git openssh curl sudo namcap >/dev/null 2>&1
          useradd -m builder 2>/dev/null || true
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          git config --global --add safe.directory '*'
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: resolve version + zip sha256s
        id: ver
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          echo "tag=$TAG"
          case "$TAG" in
            v*) PKGVER="${TAG#v}" ;;
            *) echo "error: tag must look like vX.Y.Z, got '$TAG'" >&2; exit 1 ;;
          esac
          case "$PKGVER" in
            *"-"*) echo "error: pkgver must not contain '-': $PKGVER" >&2; exit 1 ;;
          esac
          CARGO_VER="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          echo "cargo version: $CARGO_VER / tag version: $PKGVER"
          if [ "$CARGO_VER" != "$PKGVER" ]; then
            echo "error: Cargo.toml version ($CARGO_VER) != tag version ($PKGVER)." >&2
            echo "Bump [workspace.package] version first, then re-cut the Release." >&2
            exit 1
          fi
          PKGREL="${{ inputs.pkgrel || '1' }}"
          # Zips were built once by the release workflow and attached to
          # the Release before it was published (curl -fsSL fails loudly
          # if an asset is missing — a half-ready Release never proceeds).
          for arch in x86_64 aarch64; do
            ZIP_URL="https://github.com/${{ github.repository }}/releases/download/$TAG/zz-$PKGVER-linux-$arch.zip"
            echo "downloading $ZIP_URL"
            curl -fsSL "$ZIP_URL" -o "/tmp/zz-$arch.zip"
          done
          SHA_X64="$(sha256sum /tmp/zz-x86_64.zip | cut -d' ' -f1)"
          SHA_ARM="$(sha256sum /tmp/zz-aarch64.zip | cut -d' ' -f1)"
          echo "sha_x64=$SHA_X64"
          echo "sha_arm=$SHA_ARM"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "pkgver=$PKGVER" >> "$GITHUB_OUTPUT"
          echo "pkgrel=$PKGREL" >> "$GITHUB_OUTPUT"
          echo "sha_x64=$SHA_X64" >> "$GITHUB_OUTPUT"
          echo "sha_arm=$SHA_ARM" >> "$GITHUB_OUTPUT"

      - name: render PKGBUILD
        run: |
          ./packaging/aur/render.sh "${{ steps.ver.outputs.pkgver }}" "${{ steps.ver.outputs.sha_x64 }}" "${{ steps.ver.outputs.sha_arm }}" /tmp/aur-out
          PKGREL="${{ steps.ver.outputs.pkgrel }}"
          if [ "$PKGREL" != "1" ]; then
            sed -i "s/^pkgrel=1$/pkgrel=$PKGREL/" /tmp/aur-out/zz-lang/PKGBUILD
          fi
          echo "--- zz-lang/PKGBUILD ---"
          cat /tmp/aur-out/zz-lang/PKGBUILD

      - name: generate .SRCINFO + namcap lint
        run: |
          pkg=zz-lang
          rm -rf "/tmp/build-$pkg"
          mkdir -p "/tmp/build-$pkg"
          cp "/tmp/aur-out/$pkg/PKGBUILD" "/tmp/build-$pkg/PKGBUILD"
          chown -R builder:builder "/tmp/build-$pkg"
          su builder -c "cd /tmp/build-$pkg && makepkg --printsrcinfo > .SRCINFO"
          cp "/tmp/build-$pkg/.SRCINFO" "/tmp/aur-out/$pkg/.SRCINFO"
          # Artifact upload skips dotfiles: also stage it under a plain
          # name. The push job renames it back to `.SRCINFO` (AUR requires
          # the dot name in-repo).
          cp "/tmp/build-$pkg/.SRCINFO" "/tmp/aur-out/$pkg/SRCINFO"
          echo "--- $pkg/.SRCINFO ---"
          cat "/tmp/aur-out/$pkg/.SRCINFO"
          echo "--- namcap $pkg/PKGBUILD ---"
          su builder -c "cd /tmp/build-$pkg && namcap PKGBUILD" || true

      - name: upload AUR files
        uses: actions/upload-artifact@v4
        with:
          name: aur-zz-lang
          path: /tmp/aur-out/zz-lang/
          if-no-files-found: error

  push-aur:
    name: push zz-lang to AUR
    # SSH pushes run on plain ubuntu-latest (not the Arch container):
    # stock OpenSSH there is the ecosystem standard for AUR publishing.
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Only the pinned host keys file is needed from the repo.
          sparse-checkout: packaging/aur/aur_known_hosts
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: aur-zz-lang
          path: /tmp/aur-pkg/
      - name: setup AUR ssh
        run: |
          # Resolve HOME from the passwd db for whoever we actually are.
          # Runners have shown a whoami/HOME split (user `runner` with
          # HOME=/root), which makes `~/.ssh` point at an unwritable dir.
          # Deriving it here keeps every path below correct regardless.
          REAL_HOME="$(getent passwd "$(whoami)" | cut -d: -f6)"
          [ -n "$REAL_HOME" ] || REAL_HOME="/home/$(whoami)"
          if [ "$REAL_HOME" != "$HOME" ]; then
            echo "HOME skew detected (whoami=$(whoami) HOME=$HOME resolved=$REAL_HOME), exporting fixed HOME"
            export HOME="$REAL_HOME"
          fi
          if [ ! -w "$HOME" ]; then
            echo "error: HOME=$HOME is not writable for user $(whoami); cannot set up SSH." >&2
            exit 1
          fi
          echo "whoami=$(whoami) HOME=$HOME"
          if [ -z "${AUR_SSH_PRIVATE_KEY:-}" ]; then
            echo "error: secret AUR_SSH_PRIVATE_KEY is not set." >&2
            echo "Add the AUR account SSH private key as a repo secret first." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          # Host keys are pinned in-repo (packaging/aur/aur_known_hosts) —
          # no runtime keyscan, nothing to flake. ssh-keygen -F validates
          # real entries (a grep would match `#` comment lines).
          cp packaging/aur/aur_known_hosts ~/.ssh/known_hosts
          if ! ssh-keygen -F aur.archlinux.org -f ~/.ssh/known_hosts >/dev/null 2>&1; then
            echo "error: pinned known_hosts has no aur.archlinux.org entry." >&2
            exit 1
          fi
          chmod 600 ~/.ssh/known_hosts
          echo "--- pinned AUR host key fingerprints ---"
          ssh-keygen -lf ~/.ssh/known_hosts
          printf 'Host aur.archlinux.org\n  User aur\n  IdentityFile ~/.ssh/aur\n  IdentitiesOnly yes\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Layer check: host-key problems must surface HERE with context,
          # not later at clone time. Anything but a host-key error is fine —
          # even "Permission denied" proves verification passed.
          echo "--- ssh handshake smoke test ---"
          ls -la ~/.ssh
          cat ~/.ssh/config
          SSH_OUT="$(ssh -o BatchMode=yes -o ConnectTimeout=15 -T aur@aur.archlinux.org 2>&1)" || true
          echo "$SSH_OUT"
          case "$SSH_OUT" in
            *"Host key verification failed"*)
              echo "error: AUR host key verification failed against pinned keys." >&2
              echo "The server may have rotated keys — compare the logged" >&2
              echo "fingerprints with a fresh 'ssh-keyscan aur.archlinux.org'" >&2
              echo "and update packaging/aur/aur_known_hosts if legitimate." >&2
              echo "--- DEBUG: verbose handshake ---" >&2
              ssh -vv -o BatchMode=yes -o ConnectTimeout=15 -T aur@aur.archlinux.org 2>&1 | grep -iE "known_hosts|host key|found key|verify|authenticat|offer|read.*key|bad owner|permission" | head -30 >&2 || true
              echo "--- DEBUG: what this runner actually sees ---" >&2
              ssh -V >&2 || true
              getent ahosts aur.archlinux.org >&2 || echo "(no getent result)" >&2
              ssh-keyscan aur.archlinux.org 2>/dev/null | grep -v "^#" | ssh-keygen -lf - >&2 || echo "(keyscan produced no keys)" >&2
              exit 1
              ;;
          esac
          ls -la ~/.ssh
          echo "--- AUR package files ---"
          ls -la /tmp/aur-pkg/
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

      - name: push zz-lang to AUR
        run: |
          PKGVER="${{ needs.publish.outputs.pkgver }}"
          PKGREL="${{ needs.publish.outputs.pkgrel }}"
          pkg=zz-lang
          echo "=== $pkg ($PKGVER-$PKGREL) ==="
          rm -rf "/tmp/aur-$pkg"
          git clone "ssh://aur@aur.archlinux.org/$pkg.git" "/tmp/aur-$pkg"
          cp /tmp/aur-pkg/PKGBUILD "/tmp/aur-$pkg/PKGBUILD"
          cp /tmp/aur-pkg/SRCINFO "/tmp/aur-$pkg/.SRCINFO"
          cd "/tmp/aur-$pkg"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "$pkg already at $PKGVER-$PKGREL, skipping push"
            exit 0
          fi
          git commit -m "upgpkg: $pkg $PKGVER-$PKGREL"
          git push origin HEAD:master
          echo "pushed $pkg $PKGVER-$PKGREL"
