name: Cross-platform smoke

# Temporary fast lane for the macOS/Windows fix: the full CI matrix spends
# ~12 minutes per round and runs every suite, which is the wrong feedback
# loop when one AOT link step or one native-runtime test is red.
#
# Runs only the two failing checks, on both architectures of each family:
#   macos   -> chunk_aot_diff (the AOT link that failed on ld64)
#   windows -> zz_native_rt term tests (poll on redirected stdin)
#
# `workflow_dispatch` only shows up once the file is on the default branch,
# so pushes to the working branch trigger it as well. Delete this workflow
# when the six-leg matrix is green.

on:
  workflow_dispatch:
  push:
    branches: [feat/crossplatform-ci-cd]
    paths:
      - "crates/zz_codegen/src/runtime/**"
      - "crates/zz_codegen/src/cache.rs"
      - "crates/zz_codegen/src/compile.rs"
      - "crates/zz_native_rt/src/term.rs"
      - "crates/zz_cli/tests/chunk_aot_diff.rs"
      - "crates/zz_cli/tests/support/**"
      - ".github/workflows/crossplatform-smoke.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  macos:
    name: macos (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: aarch64, runner: macos-26 }
          - { name: x86_64, runner: macos-26-intel }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: smoke-${{ matrix.name }}

      - name: native toolchain
        run: |
          set -euo pipefail
          clang --version
          clang -E -x c - <<< '#include <curl/curl.h>' > /dev/null
          clang -E -x c - <<< '#include <sqlite3.h>' > /dev/null

      - name: AOT link + HIR/chunk output diff
        run: cargo test -p zz_cli --test chunk_aot_diff chunk_matches_hir_stdout_and_exit -- --nocapture

  windows:
    name: windows (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x86_64, runner: windows-2025 }
          - { name: aarch64, runner: windows-11-arm }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: smoke-${{ matrix.name }}

      # MSVC headers/libs for the cc-built dependency shims (ring, the
      # cabi fallback). Same setup as the full matrix.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}

      # Git for Windows ships coreutils `/usr/bin/link.exe`, which shadows
      # the MSVC linker for rustc. Remove it and pin the toolchain linker.
      - name: unshadow the MSVC linker
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vctools = $env:VCToolsInstallDir
          if (-not $vctools) { throw "VCToolsInstallDir unset; msvc-dev-cmd did not run" }
          $arch = "${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}"
          $link = Join-Path $vctools "bin\Host$arch\$arch\link.exe"
          if (-not (Test-Path $link)) { throw "MSVC linker not found: $link" }
          $triple = "${{ runner.arch == 'ARM64' && 'aarch64-pc-windows-msvc' || 'x86_64-pc-windows-msvc' }}"
          $var = "CARGO_TARGET_" + ($triple.ToUpper() -replace '-', '_') + "_LINKER"
          "$var=$link" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $gitLink = "C:\Program Files\Git\usr\bin\link.exe"
          if (Test-Path $gitLink) { Remove-Item $gitLink -Force }
          $resolved = (Get-Command link.exe -ErrorAction SilentlyContinue).Source
          Write-Host "link.exe -> $resolved"
          if (-not $resolved -or $resolved -notmatch 'VC\\Tools\\MSVC') {
            throw "MSVC link.exe does not win the PATH lookup (got '$resolved')"
          }

      - name: terminal poll on redirected stdin
        run: cargo test -p zz_native_rt --lib term::tests -- --nocapture
