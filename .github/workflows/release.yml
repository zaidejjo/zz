name: release

# Auto-cuts a GitHub Release from the workspace version in Cargo.toml.
# You only bump `[workspace.package] version`, merge to main, and this
# creates tag `vX.Y.Z` + Release (auto-generated notes) with the
# prebuilt `zz`+`zz-lsp` zips attached. Downstream publishers
# (docker-publish, aur-publish) trigger off that Release and consume the
# zips — nobody rebuilds the compiler, nobody hand-creates tags.
#
# Trigger: CI success on main (merge commits are tested by CI; release
# only runs on a green tree — it runs no tests itself), plus manual
# dispatch. Push-to-main is deliberately NOT a trigger: every merge
# already ran CI, and re-running here would duplicate it.
#
# Downstream trigger contract: docker-publish and aur-publish listen for
# `release: published`, and GitHub does NOT fire that event when the
# Release is created with GITHUB_TOKEN (token-authenticated API activity
# never triggers new workflow runs — anti-recursion rule). So the tag +
# Release below are created with a user PAT (`RELEASE_TOKEN` secret,
# Contents read+write on this repo). Without it the Release still cuts
# fine, but docker/AUR will never fire — check the step logs for the
# explicit warning.
#
# Flow: resolve version -> skip if released -> sync Cargo.lock ->
# build zips (linux + macos, in parallel) -> create Release WITH
# the zips attached (single shot, so `release: published` consumers
# never see a half-ready Release).
#
# Lock safety: bumping the workspace version without regenerating
# Cargo.lock breaks every `cargo build --locked` downstream. So before
# tagging, this syncs the lockfile (`cargo metadata` refreshes it
# minimally) and pushes the fix. A tag is only cut on a tree whose
# lock verifies clean.
#
# Idempotent: if tag `vX.Y.Z` or its Release already exists, no-op.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Resolve version and report without creating anything"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  cut:
    name: cut release from Cargo.toml
    # Only run on green CI (manual dispatch always runs).
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pkgver: ${{ steps.ver.outputs.pkgver }}
      tag: ${{ steps.ver.outputs.tag }}
      skip: ${{ steps.exists.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: resolve version
        id: ver
        run: |
          PKGVER="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [ -z "$PKGVER" ]; then
            echo "error: could not read [workspace.package] version from Cargo.toml" >&2
            exit 1
          fi
          case "$PKGVER" in
            *"-"*|*" "*) echo "error: invalid version '$PKGVER'" >&2; exit 1 ;;
          esac
          case "$PKGVER" in
            *"-"*) echo "error: pkgver must not contain '-': $PKGVER" >&2; exit 1 ;;
          esac
          TAG="v$PKGVER"
          echo "pkgver=$PKGVER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Cargo.toml version: $PKGVER -> tag $TAG"

      - name: skip if already released
        id: exists
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "tag $TAG already exists, nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists, nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        if: steps.exists.outputs.skip != 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.exists.outputs.skip != 'true'

      - name: sync Cargo.lock with workspace version
        if: steps.exists.outputs.skip != 'true'
        run: |
          if cargo metadata --locked --format-version 1 >/dev/null 2>&1; then
            echo "Cargo.lock already in sync, nothing to do"
            exit 0
          fi
          echo "Cargo.lock stale for this version bump, regenerating..."
          # Unlocked metadata refreshes the lockfile minimally (keeps pinned
          # dep versions where possible, updates workspace member versions).
          cargo metadata --format-version 1 >/dev/null
          cargo metadata --locked --format-version 1 >/dev/null
          echo "lock regenerated and verified"
          if [ "${{ inputs['dry-run'] || 'false' }}" = "true" ]; then
            echo "dry-run: would sync Cargo.lock (direct push or PR)"
            git diff --stat -- Cargo.lock
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: sync Cargo.lock for ${{ steps.ver.outputs.tag }}"
          if git push origin HEAD:main 2>/dev/null; then
            echo "pushed lock sync straight to main"
            exit 0
          fi
          echo "direct push to main blocked (branch protection) — opening a PR instead"
          TAG="${{ steps.ver.outputs.tag }}"
          BRANCH="chore/sync-lock-$TAG"
          git checkout -B "$BRANCH"
          # Re-runs overwrite the same branch so there is ever one PR per tag.
          git push --force-with-lease origin "$BRANCH" || git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --base main --json number --jq '.[0].number')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore: sync Cargo.lock for $TAG" \
              --body "Regenerates Cargo.lock for the $TAG version bump (required for \`cargo build --locked\` downstream). Merge this PR and the $TAG release cuts automatically."
          else
            echo "lock-sync PR already open, updated in place"
          fi
          echo "error: merge the lock-sync PR ($BRANCH) and the release will cut on merge." >&2
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-assets:
    name: build release zip (${{ matrix.os }}-${{ matrix.arch }})
    needs: [cut]
    # Same CI gate as `cut` (a skipped `cut` leaves `skip` empty, which
    # `!= 'true'` would wrongly pass — belt and suspenders).
    if: ${{ (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && needs.cut.outputs.skip != 'true' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # One target failing must not cancel the others: we want all logs.
      # The publish step refuses to cut the Release with a zip missing.
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            runner: ubuntu-latest
          - os: linux
            arch: aarch64
            runner: ubuntu-24.04-arm
          - os: macos
            arch: aarch64
            runner: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the exact tree CI tested: the main HEAD the release
          # resolves from (workflow_run checks out the default branch).
          ref: main
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install native deps (linux)
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang libcurl4-openssl-dev libsqlite3-dev zip unzip
      - name: install native deps (macos)
        if: matrix.os == 'macos'
        run: brew install zip unzip
      - name: build + zip
        run: |
          PKGVER="${{ needs.cut.outputs.pkgver }}"
          TAG="${{ needs.cut.outputs.tag }}"
          CARGO_VER="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [ "$CARGO_VER" != "$PKGVER" ]; then
            echo "error: Cargo.toml version ($CARGO_VER) != tag version ($PKGVER)." >&2
            exit 1
          fi
          export CARGO_PROFILE_RELEASE_DEBUG=false
          cargo build --release --locked -p zz_cli -p zz_lsp
          ./target/release/zz --version
          test -x ./target/release/zz-lsp
          if [ "${{ matrix.os }}" = "macos" ]; then
            strip -x target/release/zz target/release/zz-lsp
          else
            strip target/release/zz target/release/zz-lsp
          fi
          # Native-runtime archive + static libstd for the prebuilt link:
          # AOT programs built by this toolchain resolve them with no
          # sources and no Rust toolchain (see ffi.rs resolve_staticlib).
          # Static rlib (#303): linked AOT binaries carry no libstd
          # dependency and no RUNPATH — no sidecar next to outputs.
          cargo build --release --locked -p zz_native_rt
          RT_A="$(ls target/release/libzz_native_rt.a)"
          # Strip debug symbols from the archive before shipping: the
          # workspace release profile keeps debuginfo (184M); stripped
          # it is ~32M and zips to ~12M with the rlib. Final AOT links
          # are unaffected (only referenced objects are pulled).
          # GNU strip uses -g, BSD (macos) uses -S for the same.
          if [ "${{ matrix.os }}" = "macos" ]; then
            strip -S "$RT_A"
          else
            strip -g "$RT_A"
          fi
          LIBDIR="$(rustc --print target-libdir)"
          RT_SO=""
          for f in "$LIBDIR"/libstd-*.rlib; do
            [ -e "$f" ] || continue
            RT_SO="$f"
          done
          test -n "$RT_SO"
          echo "native rt: $RT_A + $RT_SO"
          ZIP="zz-$PKGVER-${{ matrix.os }}-${{ matrix.arch }}.zip"
          rm -rf dist "$ZIP"
          mkdir -p dist dist/lib
          cp target/release/zz target/release/zz-lsp LICENSE README.md dist/
          cp "$RT_A" "$RT_SO" dist/lib/
          (cd dist && zip -9 -r "../$ZIP" zz zz-lsp LICENSE README.md lib)
          unzip -l "$ZIP"
      - name: upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-zip-${{ matrix.os }}-${{ matrix.arch }}
          path: zz-*.zip
          if-no-files-found: error

  publish-release:
    name: create release with prebuilt zips
    needs: [cut, build-assets]
    # Same CI gate as above (see build-assets).
    if: ${{ (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && needs.cut.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: release-zip-*
          merge-multiple: true
      - name: resolve release token
        run: |
          if [ -z "${{ secrets.RELEASE_TOKEN }}" ]; then
            echo "::warning::RELEASE_TOKEN secret is not set — falling back to GITHUB_TOKEN. The Release will cut, but docker-publish/aur-publish will NOT trigger (GitHub suppresses workflow runs from token-created releases). Add a PAT with Contents read+write as RELEASE_TOKEN to enable the chain."
          else
            echo "using RELEASE_TOKEN (user PAT): downstream release workflows will trigger"
          fi
      - name: create tag + release with assets (if missing)
        run: |
          TAG="${{ needs.cut.outputs.tag }}"
          if [ "${{ inputs['dry-run'] || 'false' }}" = "true" ]; then
            echo "dry-run: would create release $TAG with:"
            ls -la zz-*.zip
            exit 0
          fi
          # Re-check: a concurrent run may have cut the tag while we built.
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null \
            || gh release view "$TAG" >/dev/null 2>&1; then
            echo "tag/release $TAG appeared concurrently, nothing to do"
            exit 0
          fi
          ls -la zz-*.zip
          test -f "zz-${{ needs.cut.outputs.pkgver }}-linux-x86_64.zip" \
            || { echo "error: linux x86_64 zip missing, refusing half-ready release." >&2; exit 1; }
          test -f "zz-${{ needs.cut.outputs.pkgver }}-linux-aarch64.zip" \
            || { echo "error: linux aarch64 zip missing, refusing half-ready release." >&2; exit 1; }
          test -f "zz-${{ needs.cut.outputs.pkgver }}-macos-aarch64.zip" \
            || { echo "error: macos aarch64 zip missing, refusing half-ready release." >&2; exit 1; }
          gh release create "$TAG" \
            --target "main" \
            --title "$TAG" \
            --generate-notes \
            zz-*.zip
          echo "created release $TAG with prebuilt zips"
        env:
          # User PAT when present so the `release: published` event is
          # genuine and downstream workflows fire; GITHUB_TOKEN fallback
          # cuts the Release but triggers nothing (see warning above).
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN != '' && secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
