name: release

# Auto-cuts a GitHub Release from the workspace version in Cargo.toml.
# You only bump `[workspace.package] version`, merge to main, and this
# creates tag `vX.Y.Z` + Release (auto-generated notes). Downstream
# publishers (docker-publish, aur-publish) trigger off that Release —
# nobody hand-creates tags anymore.
#
# Lock safety: bumping the workspace version without regenerating
# Cargo.lock breaks every `cargo build --locked` downstream (Docker,
# release zips). So before tagging, this syncs the lockfile
# (`cargo metadata` refreshes it minimally) and pushes the fix to main.
# A tag is only cut on a tree whose lock verifies clean.
#
# Idempotent: if tag `vX.Y.Z` or its Release already exists, no-op.

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Resolve version and report without creating anything"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  cut:
    name: cut release from Cargo.toml
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: resolve version
        id: ver
        run: |
          PKGVER="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [ -z "$PKGVER" ]; then
            echo "error: could not read [workspace.package] version from Cargo.toml" >&2
            exit 1
          fi
          case "$PKGVER" in
            *"-"*|*" "*) echo "error: invalid version '$PKGVER'" >&2; exit 1 ;;
          esac
          TAG="v$PKGVER"
          echo "pkgver=$PKGVER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Cargo.toml version: $PKGVER -> tag $TAG"

      - name: skip if already released
        id: exists
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "tag $TAG already exists, nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists, nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        if: steps.exists.outputs.skip != 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.exists.outputs.skip != 'true'

      - name: sync Cargo.lock with workspace version
        if: steps.exists.outputs.skip != 'true'
        run: |
          if cargo metadata --locked --format-version 1 >/dev/null 2>&1; then
            echo "Cargo.lock already in sync, nothing to do"
            exit 0
          fi
          echo "Cargo.lock stale for this version bump, regenerating..."
          # Unlocked metadata refreshes the lockfile minimally (keeps pinned
          # dep versions where possible, updates workspace member versions).
          cargo metadata --format-version 1 >/dev/null
          cargo metadata --locked --format-version 1 >/dev/null
          echo "lock regenerated and verified"
          if [ "${{ inputs['dry-run'] || 'false' }}" = "true" ]; then
            echo "dry-run: would sync Cargo.lock (direct push or PR)"
            git diff --stat -- Cargo.lock
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: sync Cargo.lock for ${{ steps.ver.outputs.tag }}"
          if git push origin HEAD:main 2>/dev/null; then
            echo "pushed lock sync straight to main"
            exit 0
          fi
          echo "direct push to main blocked (branch protection) — opening a PR instead"
          TAG="${{ steps.ver.outputs.tag }}"
          BRANCH="chore/sync-lock-$TAG"
          git checkout -B "$BRANCH"
          # Re-runs overwrite the same branch so there is ever one PR per tag.
          git push --force-with-lease origin "$BRANCH" || git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --base main --json number --jq '.[0].number')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore: sync Cargo.lock for $TAG" \
              --body "Regenerates Cargo.lock for the $TAG version bump (required for \`cargo build --locked\` downstream: Docker, release zips). Merge this PR and the $TAG release cuts automatically."
          else
            echo "lock-sync PR already open, updated in place"
          fi
          echo "error: merge the lock-sync PR ($BRANCH) and the release will cut on merge." >&2
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: create tag + release (if missing)
        if: steps.exists.outputs.skip != 'true'
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if [ "${{ inputs['dry-run'] || 'false' }}" = "true" ]; then
            echo "dry-run: would create release $TAG from ${{ github.sha }}"
            exit 0
          fi
          # Re-check: the lock-sync push above (or a concurrent run) may have
          # created the tag while we worked.
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null \
            || gh release view "$TAG" >/dev/null 2>&1; then
            echo "tag/release $TAG appeared concurrently, nothing to do"
            exit 0
          fi
          gh release create "$TAG" \
            --target "main" \
            --title "$TAG" \
            --generate-notes
          echo "created release $TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
