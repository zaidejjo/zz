[workspace]
resolver = "2"
members = ["crates/zz_frontend", "crates/zz_checker", "crates/zz_hir", "crates/zz_runtime", "crates/zz_stdlib", "crates/zz_codegen", "crates/zz_cli", "crates/zz_fmt", "crates/zz_lsp", "crates/zz_native_rt", "crates/zz_pm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
semver = "1"
sha2 = "0.10"
hex = "0.4"
rayon = "1"
memmap2 = "0.9"
toml = "0.8"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
flate2 = "1"

[profile.release]
debug = true
