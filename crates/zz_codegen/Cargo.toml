[package]
name = "zz_codegen"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# When enabled, forces zz_lower's needs_safepoint() to return true, disabling
# lock elision (D8) so state accesses always go through the process-global
# lock. Used for self-testing locking correctness (nolock builds).
nolock_selftest = ["zz_lower/nolock_selftest"]

[dependencies]
zz_codegen_cc = { path = "../zz_codegen_cc" }
zz_codegen_ffi = { path = "../zz_codegen_ffi" }
zz_codegen_runtime = { path = "../zz_codegen_runtime" }
zz_codegen_types = { path = "../zz_codegen_types" }
zz_chunk = { path = "../zz_chunk" }
zz_hir = { path = "../zz_hir" }
zz_lower = { path = "../zz_lower" }

[dev-dependencies]
zz_checker = { path = "../zz_checker" }
zz_frontend = { path = "../zz_frontend" }
zz_runtime = { path = "../zz_runtime" }
zz_stdlib = { path = "../zz_stdlib" }
