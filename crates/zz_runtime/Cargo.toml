[package]
name = "zz_runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# When enabled, batch state reads do NOT acquire the state lock, allowing
# self-testing of multi-read atomicity without locking (nolock builds).
nolock_selftest = []

[dependencies]
zz_frontend = { path = "../zz_frontend" }
zz_checker = { path = "../zz_checker" }
zz_native_rt = { path = "../zz_native_rt" }
zz_arena = { path = "../zz_arena" }
codespan-reporting = "0.11"

[dev-dependencies]
loom = "0.7"
