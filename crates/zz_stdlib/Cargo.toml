[package]
name = "zz_stdlib"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zz_frontend = { path = "../zz_frontend" }
zz_checker = { path = "../zz_checker" }
zz_hir = { path = "../zz_hir" }
zz_runtime = { path = "../zz_runtime" }
zz_native_rt = { path = "../zz_native_rt" }
base64 = "0.22"
crossbeam-deque = "0.8"
libc = "0.2"
memchr = "2"
socket2 = "0.6"
urlencoding = "2"
reqwest = { version = "0.12", features = ["blocking"] }
rusqlite = { version = "0.32", features = ["bundled", "column_decltype"] }
rustls = { workspace = true }
webpki-roots = { workspace = true }
rustls-pki-types = { workspace = true }
httparse = "1.10.1"
rustls-pemfile = "2.2.0"
sha1 = "0.11.0"

[dev-dependencies]
rcgen = "0.13"
