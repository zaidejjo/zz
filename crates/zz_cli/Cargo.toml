[package]
name = "zz_cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "zz"
path = "src/main.rs"

[dependencies]
zz_frontend = { path = "../zz_frontend" }
zz_checker = { path = "../zz_checker" }
zz_hir = { path = "../zz_hir" }
zz_ir = { path = "../zz_ir" }
zz_runtime = { path = "../zz_runtime" }
zz_stdlib = { path = "../zz_stdlib" }
zz_codegen = { path = "../zz_codegen" }
zz_fmt = { path = "../zz_fmt" }
zz_pm = { path = "../zz_pm" }
zz_plugin = { path = "../zz_plugin" }
codespan-reporting = "0.11"
reedline = "0.51"
dirs = "6"
sha2 = { workspace = true }
nu-ansi-term = "0.50"
toml = "0.8"
serde_json = { workspace = true }
hex = { workspace = true }
# S1 arena-scale: check-cache derives.
serde = { workspace = true }
base64 = { workspace = true }
ureq = { workspace = true }
# `zz run --watch` supervision: signal flags (all platforms).
signal-hook = "0.3"
tar = { workspace = true }
lzma-rs = { workspace = true }

# `zz run --watch`: SIGTERM delivery to the supervised child on unix
# (Windows falls back to Child::kill).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
