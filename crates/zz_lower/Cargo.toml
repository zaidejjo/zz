[package]
name = "zz_lower"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HIR→C lowering for the ZZ native (AOT) backend"

[features]
# When enabled, forces needs_safepoint() to return true, disabling lock
# elision (D8) so that state accesses always go through the process-global
# lock. Used for self-testing that locking is correct (nolock builds).
nolock_selftest = []

[dependencies]
zz_codegen_types = { path = "../zz_codegen_types" }
zz_codegen_runtime = { path = "../zz_codegen_runtime" }
zz_codegen_ffi = { path = "../zz_codegen_ffi" }
zz_checker = { path = "../zz_checker" }
zz_frontend = { path = "../zz_frontend" }
zz_hir = { path = "../zz_hir" }
zz_stdlib = { path = "../zz_stdlib" }
zz_arena = { path = "../zz_arena" }
